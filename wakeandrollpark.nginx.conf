# Wake & Roll Park - wakeandrollpark.pl & wakeandroll.pl
# Proxy przez Cloudflare SSL Full

server {
    listen 80;
    listen [::]:80;
    server_name wakeandrollpark.pl www.wakeandrollpark.pl wakeandroll.pl www.wakeandroll.pl;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        auth_basic off;
        root /var/www/certbot;
    }

    location / {
        return 301 https://wakeandrollpark.pl$request_uri;
    }
}

# Przekierowanie www i wakeandroll.pl -> wakeandrollpark.pl (HTTPS)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.wakeandrollpark.pl wakeandroll.pl www.wakeandroll.pl;
    server_tokens off;
    include snippets/jubilerpabianice-tls.conf;

    location ^~ /.well-known/acme-challenge/ {
        auth_basic off;
        root /var/www/certbot;
    }

    location / {
        return 301 https://wakeandrollpark.pl$request_uri;
    }
}

# Glowny vhost wakeandrollpark.pl
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name wakeandrollpark.pl;
    include snippets/jubilerpabianice-tls.conf;

    root /var/www/wakeandrollpark.pl/current;
    index index.html;
    charset utf-8;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/manifest+json application/xml image/svg+xml font/ttf font/otf;

    location ^~ /.well-known/acme-challenge/ {
        auth_basic off;
        root /var/www/certbot;
    }

    # API Proxy do kontenera Docker (port 8793)
    location /api/ {
        proxy_pass http://127.0.0.1:8793/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Pliki z hashem w nazwie (Astro) - cache 1 rok
    location ^~ /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Grafiki i zdjecia parku
    location ~* \.(?:woff2?|ttf|otf|avif|webp|png|jpe?g|gif|svg|ico)$ {
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    # CSS i JS w roocie
    location ~* \.(?:css|js)$ {
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    # Obsluga stron HTML (index, admin)
    location / {
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        try_files $uri $uri/ $uri.html =404;
    }
}
